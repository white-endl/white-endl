<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Robi conversation pipeline: RFID card, speech-to-text, LLM dialogue, text-to-speech, session log">
<rect width="1200" height="230" rx="18" fill="#FAFAF7"/>
<rect x="0.5" y="0.5" width="1199" height="229" rx="18" fill="none" stroke="#D9DCE1"/>
<text x="40" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5B6270">one conversation turn, on a Raspberry Pi in the classroom</text>
<rect x="37" y="70" width="198" height="96" rx="12" fill="#FAFAF7" stroke="#D9DCE1" stroke-width="1.5"/><text x="136" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#14161A">RFID card</text><text x="136" y="140" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6270">who is talking</text><line x1="243" y1="118.0" x2="255" y2="118.0" stroke="#0B7FB8" stroke-width="2"/><path d="M253,112.0 L261,118.0 L253,124.0" fill="none" stroke="#0B7FB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="269" y="70" width="198" height="96" rx="12" fill="#FAFAF7" stroke="#D9DCE1" stroke-width="1.5"/><text x="368" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#14161A">Speech-to-text</text><text x="368" y="140" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6270">child's answer</text><line x1="475" y1="118.0" x2="487" y2="118.0" stroke="#0B7FB8" stroke-width="2"/><path d="M485,112.0 L493,118.0 L485,124.0" fill="none" stroke="#0B7FB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="70" width="198" height="96" rx="12" fill="#E3F1F8" stroke="#0B7FB8" stroke-width="2"/><text x="600" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#14161A">LLM dialogue</text><text x="600" y="140" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6270">three dialogue modes</text><line x1="707" y1="118.0" x2="719" y2="118.0" stroke="#0B7FB8" stroke-width="2"/><path d="M717,112.0 L725,118.0 L717,124.0" fill="none" stroke="#0B7FB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round